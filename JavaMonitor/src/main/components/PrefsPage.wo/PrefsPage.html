<wo:JMTablerLook selectedPage="$PREF_PAGE" title="Preferences">
	<div class="page-header d-print-none">
		<div class="row g-2 align-items-center">
			<div class="col">
				<div class="page-pretitle">JavaMonitor</div>
				<h2 class="page-title">Preferences</h2>
			</div>
		</div>
	</div>

	<div class="row row-cards">
		<div class="col-12">
			<div class="card">
				<div class="card-header">
					<h3 class="card-title">Monitor password</h3>
				</div>
				<div class="card-body">
					<div class="mb-3 text-secondary">
						<wo:if condition="$siteConfig.isPasswordRequired">A password is currently set.</wo:if>
						<wo:if condition="$siteConfig.isPasswordRequired" negate="$true">No password is currently set.</wo:if>
					</div>
					<wo:form multipleSubmit="$true">
						<div class="mb-3">
							<label class="form-label">New password</label>
							<wo:textfield value="$adminPassword1" class="form-control" />
						</div>
						<div class="mb-3">
							<label class="form-label">Confirm new password</label>
							<wo:textfield value="$adminPassword2" class="form-control" />
						</div>
						<div class="btn-list">
							<wo:submit action="$passwordChangeClicked" value="Change password" class="btn btn-primary" />
							<wo:submit action="$passwordResetClicked" value="Reset password" class="btn btn-outline-danger" />
						</div>
					</wo:form>
				</div>
			</div>
		</div>

		<div class="col-12">
			<div class="card">
				<div class="card-header">
					<h3 class="card-title">Detail view refresh</h3>
				</div>
				<div class="card-body">
					<p class="text-secondary">The application detail page can auto-refresh in your browser.</p>
					<wo:form>
						<div class="mb-3">
							<label class="form-check form-switch">
								<wo:checkbox checked="$siteConfig.viewRefreshEnabled" class="form-check-input" />
								<span class="form-check-label">Auto-refresh the detail view</span>
							</label>
						</div>
						<div class="mb-3">
							<label class="form-label">Refresh delay</label>
							<div class="input-group" style="max-width: 200px;">
								<wo:textfield value="$siteConfig.viewRefreshRate" numberformat="0" size="3" class="form-control" />
								<span class="input-group-text">seconds</span>
							</div>
						</div>
						<wo:submit action="$detailViewUpdateClicked" value="Save" class="btn btn-primary" />
					</wo:form>
				</div>
			</div>
		</div>
	</div>
</wo:JMTablerLook>
